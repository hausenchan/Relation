version: midmax-selectdb-datasets-v1
updated_at: 2026-07-31
owner: YYZ data intelligence
principles:
  - Mid-Max SelectDB is read-only production fact storage.
  - Relation only exposes audited dataset_code queries, never free-form SQL.
  - Business daily reports bind immutable snapshot_id values for replay.
  - Credentials, physical table names, and production row samples must not be committed.

datasets:
